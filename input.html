<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>飼料注文 入力</title>
<style>
:root{
  --navy:#1A3A5C;--blue:#2E6DA4;--green:#1D9E75;--green-d:#0f6e56;
  --farm0:#D6E8F7;--farm0h:#4472C4;--farm1:#E8E6FB;--farm1h:#7B66D6;--farm2:#FDE9C8;--farm2h:#ED7D31;
  --border:#d0d0cc;--text:#1a1a18;--muted:#777;--radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;background:#eef2f7;color:var(--text);min-height:100vh;padding-bottom:60px;}
.app-bar{background:var(--navy);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:50;}
.app-bar-title{font-size:15px;font-weight:700;letter-spacing:.04em;}
.app-bar-sub{font-size:11px;color:#9bc;margin-top:2px;}
.tab-bar{background:#fff;border-bottom:2px solid var(--border);display:flex;position:sticky;top:48px;z-index:40;}
.tab-item{flex:1;padding:9px 4px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;}
.tab-item.active{color:var(--navy);border-bottom-color:var(--navy);}
.card{background:#fff;border-radius:var(--radius);box-shadow:0 1px 6px rgba(0,0,0,.08);margin:12px;padding:16px;}
.card-lbl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px;padding-left:8px;border-left:3px solid var(--blue);}
.field{margin-bottom:14px;}
.field>label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.field input[type=text],.field input[type=date]{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:11px 12px;font-size:16px;font-family:inherit;color:var(--text);background:#fff;outline:none;-webkit-appearance:none;appearance:none;}
.field input:focus{border-color:var(--blue);}
.farm-chips{display:flex;gap:8px;}
.farm-chip{flex:1;border:2px solid var(--border);border-radius:8px;padding:11px 4px;text-align:center;font-size:14px;font-weight:700;cursor:pointer;background:#fff;color:var(--text);font-family:inherit;}
.farm-chip.sel-furukami{background:var(--farm0);border-color:var(--farm0h);color:var(--farm0h);}
.farm-chip.sel-dai2{background:var(--farm1);border-color:var(--farm1h);color:var(--farm1h);}
.farm-chip.sel-dai3{background:var(--farm2);border-color:var(--farm2h);color:var(--farm2h);}
.tank-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:220px;overflow-y:auto;border:1.5px solid var(--border);border-radius:8px;padding:8px;}
.tank-btn{border:1.5px solid var(--border);border-radius:6px;padding:8px 2px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:var(--text);line-height:1.3;font-family:inherit;}
.tank-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.brand-list{display:flex;flex-direction:column;gap:6px;}
.brand-btn{border:1.5px solid var(--border);border-radius:8px;padding:11px 14px;font-size:13px;font-family:inherit;cursor:pointer;background:#fff;color:var(--text);text-align:left;display:flex;align-items:center;justify-content:space-between;}
.brand-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.bag-tag{font-size:10px;background:#e0e8f0;color:var(--blue);padding:2px 6px;border-radius:4px;font-weight:700;}
.brand-btn.active .bag-tag{background:rgba(255,255,255,.2);color:#fff;}
.qty-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.qty-chip{border:1.5px solid var(--border);border-radius:6px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer;background:#fff;color:var(--text);min-width:44px;text-align:center;font-family:inherit;}
.qty-chip.active{background:var(--green);border-color:var(--green);color:#fff;}
.qty-other{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-size:16px;font-family:inherit;color:var(--text);background:#fff;outline:none;-webkit-appearance:none;}
.qty-other:focus{border-color:var(--blue);}
.add-row{display:flex;gap:10px;}
.add-btn{flex:1;border:2px solid var(--border);border-radius:8px;padding:12px;text-align:center;font-size:16px;font-weight:700;cursor:pointer;background:#fff;color:var(--text);font-family:inherit;}
.add-btn.yes.active{background:#E1F5EE;border-color:var(--green);color:var(--green-d);}
.add-btn.no.active{background:#f0f0f0;border-color:#888;color:#444;}
.err-msg{display:none;color:#c00;font-size:12px;margin-top:5px;}
.err-msg.show{display:block;}
.btn-add{width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.05em;margin-top:4px;}
.btn-add:active{opacity:.85;}
.order-item{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;background:#fff;display:flex;align-items:center;gap:10px;}
.oi-body{flex:1;}
.oi-main{font-size:13px;font-weight:700;color:var(--navy);}
.oi-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.oi-del{background:none;border:none;font-size:22px;color:#c0392b;cursor:pointer;padding:4px 8px;line-height:1;font-family:inherit;}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;}
.bf0{background:var(--farm0);color:var(--farm0h);}
.bf1{background:var(--farm1);color:var(--farm1h);}
.bf2{background:var(--farm2);color:var(--farm2h);}
.add-yes{background:#E1F5EE;color:var(--green-d);}
.add-no{background:#f0f0f0;color:#666;}
.empty-lbl{text-align:center;color:var(--muted);padding:18px;font-size:13px;}
.btn-send{width:100%;background:var(--blue);color:#fff;border:none;border-radius:10px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.05em;margin-top:8px;}
.btn-send:active{opacity:.85;}
.date-band{background:var(--navy);color:#fff;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;text-align:center;margin-top:8px;}
.month-nav{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px;}
.month-label{font-size:15px;font-weight:700;}
.month-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 14px;font-size:14px;cursor:pointer;color:var(--text);font-family:inherit;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px;}
.cal-head{background:#f0f0f0;text-align:center;padding:5px 2px;font-size:10px;font-weight:700;color:var(--muted);}
.cal-head.sun{color:#A32D2D;}.cal-head.sat{color:#185FA5;}
.cal-cell{background:#fff;min-height:46px;padding:3px;cursor:pointer;}
.cal-cell.other{background:#fafafa;}
.cal-cell.other .day-num{color:#bbb;}
.cal-cell.has-order{background:#f0faf5;}
.cal-cell.selected{outline:2.5px solid var(--green);outline-offset:-2.5px;position:relative;z-index:1;}
.day-num{font-size:11px;font-weight:600;margin-bottom:2px;line-height:1;}
.day-num.sun{color:#A32D2D;}.day-num.sat{color:#185FA5;}
.today-num{background:var(--navy);color:#fff;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;}
.dot-row{display:flex;gap:1px;flex-wrap:wrap;margin-top:2px;}
.dot{width:5px;height:5px;border-radius:50%;}
.d0{background:var(--farm0h);}.d1{background:var(--farm1h);}.d2{background:var(--farm2h);}
.cnt-lbl{font-size:8px;color:var(--muted);margin-top:1px;}
.legend-row{display:flex;gap:10px;margin-bottom:10px;font-size:10px;color:var(--muted);flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:4px;}
.legend-dot{width:8px;height:8px;border-radius:50%;}
.detail-date-lbl{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.detail-badge{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;background:#E1F5EE;color:var(--green-d);}
.warn-box{background:#FAEEDA;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:11px;color:#854F0B;display:flex;align-items:center;gap:6px;}
.det-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--border);}
.det-row:last-child{border-bottom:none;}
.det-info{flex:1;font-size:12px;}
.det-tank{font-weight:700;}
.det-brand{color:var(--muted);font-size:11px;}
.det-qty{font-size:12px;font-weight:700;color:var(--navy);white-space:nowrap;}
.det-add{font-size:10px;background:#E1F5EE;color:var(--green-d);padding:1px 5px;border-radius:3px;margin-top:2px;display:inline-block;}
.pn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
.pn-card{background:#f5f7fa;border-radius:8px;border:0.5px solid var(--border);padding:8px 10px;}
.pn-lbl{font-size:10px;color:var(--muted);margin-bottom:3px;}
.pn-date{font-size:13px;font-weight:700;color:var(--navy);}
.pn-cnt{font-size:10px;color:var(--muted);margin-top:2px;}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(50px);background:var(--navy);color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:200;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app-bar">
  <div class="app-bar-title">飼料注文</div>
  <div class="app-bar-sub">㈲ひこちゃん牧場　古井農場</div>
</div>
<div class="tab-bar">
  <div class="tab-item active" id="tab-input-btn" onclick="showTab('input')">注文入力</div>
  <div class="tab-item" id="tab-cal-btn" onclick="showTab('cal')">カレンダー</div>
</div>
<!-- 注文入力 -->
<div id="tab-input">
<div class="card">
  <div class="card-lbl">配送希望日</div>
  <div class="field"><input type="date" id="delivery-date"></div>
  <div class="date-band" id="date-band">日付を選択してください</div>
</div>
<div class="card">
  <div class="card-lbl">担当者名</div>
  <div class="field"><input type="text" id="staff-name" placeholder="例：山本"></div>
</div>
<div class="card">
  <div class="card-lbl">注文内容</div>
  <div class="field">
    <label>農場</label>
    <div class="farm-chips" id="farm-chips">
      <button class="farm-chip sel-furukami" data-farm="古井農場">①古井</button>
      <button class="farm-chip" data-farm="第2農場">②第2</button>
      <button class="farm-chip" data-farm="第3農場">③第3</button>
    </div>
  </div>
  <div class="field">
    <label>タンク番号</label>
    <div class="tank-grid" id="tank-grid"></div>
    <div class="err-msg" id="err-tank">タンクを選択してください</div>
  </div>
  <div class="field">
    <label>飼料銘柄</label>
    <div class="brand-list" id="brand-list"></div>
    <div class="err-msg" id="err-brand">銘柄を選択してください</div>
  </div>
  <div class="field">
    <label>数量（t）</label>
    <div class="qty-chips" id="qty-chips">
      <button class="qty-chip" data-qty="2">2</button>
      <button class="qty-chip" data-qty="3">3</button>
      <button class="qty-chip" data-qty="4">4</button>
      <button class="qty-chip" data-qty="5">5</button>
      <button class="qty-chip" data-qty="6">6</button>
      <button class="qty-chip" data-qty="7">7</button>
      <button class="qty-chip" data-qty="8">8</button>
    </div>
    <input class="qty-other" type="number" id="qty-other" placeholder="上記以外の数量（t）" min="0.5" max="12" step="0.5">
    <div class="err-msg" id="err-qty">数量を選択または入力してください</div>
  </div>
  <div class="field">
    <label>添加剤</label>
    <div class="add-row">
      <button class="add-btn yes" id="add-yes">有</button>
      <button class="add-btn no active" id="add-no">無</button>
    </div>
  </div>
  <button class="btn-add" id="btn-add">＋　注文を追加</button>
</div>
<div class="card">
  <div class="card-lbl">入力済み <span id="order-count"></span></div>
  <div id="order-list"><div class="empty-lbl">まだ注文がありません</div></div>
  <div id="send-wrap" style="display:none;">
    <button class="btn-send" id="btn-send">📤　注文担当者へ送信</button>
  </div>
</div>
</div>

<!-- カレンダー -->
<div id="tab-cal" style="display:none;">
<div class="card">
  <div class="month-nav">
    <button class="month-btn" id="prev-month">＜</button>
    <span class="month-label" id="month-label">読み込み中...</span>
    <button class="month-btn" id="next-month">＞</button>
  </div>
  <div class="legend-row">
    <div class="legend-item"><div class="legend-dot" style="background:var(--farm0h);"></div>①古井</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--farm1h);"></div>②第2</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--farm2h);"></div>③第3</div>
    <div class="legend-item"><div style="width:14px;height:10px;background:#f0faf5;border:1px solid #9FE1CB;border-radius:2px;"></div>注文あり</div>
  </div>
  <div id="cal-grid" class="cal-grid"></div>
</div>
<div class="card" id="detail-card" style="display:none;">
  <div id="detail-panel"></div>
</div>
<div class="card">
  <div class="card-lbl">前回・次回の配達</div>
  <div class="pn-grid" id="pn-grid">
    <div class="pn-card"><div class="pn-lbl">◀ 前回</div><div class="pn-date" style="color:var(--muted);">読み込み中</div></div>
    <div class="pn-card"><div class="pn-lbl">▶ 次回</div><div class="pn-date" style="color:var(--muted);">読み込み中</div></div>
  </div>
</div>
</div>
<div id="toast"></div>
<script>
var TANK_MASTER={
  '古井農場':[{no:'11',house:'育成'},{no:'12',house:'育成'},{no:'21',house:'母豚'},{no:'22',house:'母豚'},{no:'23',house:'母豚'},{no:'24',house:'母豚'},{no:'25',house:'母豚'},{no:'26',house:'母豚'},{no:'27',house:'母豚'},{no:'28',house:'母豚'},{no:'29',house:'母豚'},{no:'30',house:'母豚'},{no:'31',house:'分娩'},{no:'32',house:'分娩'},{no:'33',house:'分娩'},{no:'34',house:'分娩'},{no:'35',house:'分娩'},{no:'36',house:'分娩'},{no:'37',house:'分娩'},{no:'38',house:'分娩'},{no:'41',house:'子豚'},{no:'42',house:'子豚'},{no:'43',house:'子豚'},{no:'44',house:'子豚'}],
  '第2農場':[{no:'50',house:'201'},{no:'51',house:'202-3'},{no:'52',house:'204'},{no:'53',house:'205-6'},{no:'54',house:'207-8'},{no:'55',house:'209'},{no:'56',house:'210-1'},{no:'57',house:'212-3'},{no:'58',house:'214-5'},{no:'59',house:'216-7'}],
  '第3農場':[{no:'A-1',house:'301'},{no:'A-2',house:'301'},{no:'A-3',house:'302'},{no:'A-4',house:'302'},{no:'B-1',house:'303'},{no:'B-2',house:'303'},{no:'B-3',house:'304'},{no:'B-4',house:'304'},{no:'C-1',house:'305'},{no:'C-2',house:'305'},{no:'C-3',house:'306'},{no:'C-4',house:'306'},{no:'D-1',house:'307'},{no:'D-2',house:'307'},{no:'D-3',house:'308'},{no:'D-4',house:'308'},{no:'E-1',house:'309'},{no:'E-2',house:'309'},{no:'E-3',house:'310'},{no:'E-4',house:'310'},{no:'F-1',house:'311'},{no:'F-2',house:'311'},{no:'F-3',house:'312'},{no:'F-4',house:'312'}]
};
var BRAND_MASTER={
  '古井農場':[{key:'シンサウメイク',bag:false},{key:'たから母豚',bag:false},{key:'たから授乳',bag:false},{key:'たから12',bag:false},{key:'たから20PL',bag:false},{key:'たから40PL',bag:false},{key:'たから70PL',bag:false},{key:'ママコロ餌付',bag:true},{key:'ママコロ前期',bag:true},{key:'ミュー前期',bag:true},{key:'やまとX',bag:true}],
  '第2農場':[{key:'たから20PL',bag:false},{key:'たから40PL',bag:false},{key:'たから70PL',bag:false}],
  '第3農場':[{key:'たから20PL',bag:false},{key:'たから40PL',bag:false},{key:'たから70PL',bag:false}]
};
var AUTO_BRAND={育成:'シンサウメイク',母豚:'たから母豚',分娩:'たから授乳'};
var FARM_CLS={'古井農場':'sel-furukami','第2農場':'sel-dai2','第3農場':'sel-dai3'};
var BADGE_CLS={'古井農場':'bf0','第2農場':'bf1','第3農場':'bf2'};
var FARM_LABELS={'古井農場':'①古井','第2農場':'②第2','第3農場':'③第3'};
var FARM_DOT_CLS={'古井農場':'d0','第2農場':'d1','第3農場':'d2'};
var GAS_URL='https://script.google.com/macros/s/AKfycbyTBTPjewF9RDfODEXEmReu06WxctAJ7i8C8SWEs9B3n8JnSPpJ7O4R_5JqUXWXrZRV/exec';

var farm='古井農場';
var selTank=null,selBrand=null,selQty=null,selAdd='no';
var orders=[],idCnt=1,toastTimer;
var calYear=0,calMonth=0,calOrders=[],calLoaded=false,selDate=null;

function pad(n){return String(n).padStart(2,'0');}

function showTab(name){
  document.getElementById('tab-input').style.display=name==='input'?'':'none';
  document.getElementById('tab-cal').style.display=name==='cal'?'':'none';
  document.getElementById('tab-input-btn').classList.toggle('active',name==='input');
  document.getElementById('tab-cal-btn').classList.toggle('active',name==='cal');
  if(name==='cal' && !calLoaded){loadCalendar();}
}

document.addEventListener('DOMContentLoaded',function(){
  var t=new Date();
  calYear=t.getFullYear();
  calMonth=t.getMonth();
  document.getElementById('delivery-date').value=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
  updateDateBand();
  document.getElementById('delivery-date').addEventListener('change',updateDateBand);

  document.getElementById('farm-chips').addEventListener('click',function(e){
    var b=e.target.closest('.farm-chip');
    if(!b)return;
    farm=b.dataset.farm;
    document.querySelectorAll('.farm-chip').forEach(function(x){x.className='farm-chip';});
    b.classList.add(FARM_CLS[farm]);
    selTank=null;selBrand=null;
    renderTanks();renderBrands();
  });

  document.getElementById('tank-grid').addEventListener('click',function(e){
    var b=e.target.closest('.tank-btn');
    if(!b)return;
    selTank=selTank===b.dataset.no?null:b.dataset.no;
    document.querySelectorAll('.tank-btn').forEach(function(x){x.classList.remove('active');});
    if(selTank){b.classList.add('active');selBrand=AUTO_BRAND[b.dataset.house]||null;}
    else{selBrand=null;}
    document.getElementById('err-tank').classList.remove('show');
    renderBrands();
  });

  document.getElementById('brand-list').addEventListener('click',function(e){
    var b=e.target.closest('.brand-btn');
    if(!b)return;
    selBrand=selBrand===b.dataset.key?null:b.dataset.key;
    document.querySelectorAll('.brand-btn').forEach(function(x){x.classList.remove('active');});
    if(selBrand)b.classList.add('active');
    document.getElementById('err-brand').classList.remove('show');
  });

  document.getElementById('qty-chips').addEventListener('click',function(e){
    var b=e.target.closest('.qty-chip');
    if(!b)return;
    selQty=parseFloat(b.dataset.qty);
    document.querySelectorAll('.qty-chip').forEach(function(x){x.classList.remove('active');});
    b.classList.add('active');
    document.getElementById('qty-other').value='';
    document.getElementById('err-qty').classList.remove('show');
  });

  document.getElementById('qty-other').addEventListener('input',function(){
    var v=parseFloat(this.value);
    selQty=isNaN(v)?null:v;
    document.querySelectorAll('.qty-chip').forEach(function(x){x.classList.remove('active');});
    document.getElementById('err-qty').classList.remove('show');
  });

  document.getElementById('add-yes').addEventListener('click',function(){setAdd('yes');});
  document.getElementById('add-no').addEventListener('click',function(){setAdd('no');});
  document.getElementById('btn-add').addEventListener('click',addOrder);
  document.getElementById('btn-send').addEventListener('click',submitOrders);

  document.getElementById('prev-month').addEventListener('click',function(){
    calMonth--;
    if(calMonth<0){calMonth=11;calYear--;}
    calLoaded=false;
    loadCalendar();
  });
  document.getElementById('next-month').addEventListener('click',function(){
    calMonth++;
    if(calMonth>11){calMonth=0;calYear++;}
    calLoaded=false;
    loadCalendar();
  });

  loadDraft();
  renderTanks();
  renderBrands();
});

function updateDateBand(){
  var v=document.getElementById('delivery-date').value;
  if(!v){document.getElementById('date-band').textContent='日付を選択してください';return;}
  var p=v.split('-');
  var d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  var wd=['日','月','火','水','木','金','土'][d.getDay()];
  document.getElementById('date-band').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日（'+wd+'）の配送';
}

function renderTanks(){
  var tanks=TANK_MASTER[farm]||[];
  document.getElementById('tank-grid').innerHTML=tanks.map(function(t){
    return '<button class="tank-btn'+(selTank===t.no?' active':'')+'" data-no="'+t.no+'" data-house="'+t.house+'">t.no+'<br><span style="font-size:9px;opacity:.7">'+t.house+'</span></button>';
  }).join('');
}

function renderBrands(){
  var brands=BRAND_MASTER[farm]||[];
  document.getElementById('brand-list').innerHTML=brands.map(function(b){
    return '<button class="brand-btn'+(selBrand===b.key?' active':'')+'" data-key="'+b.key+'" data-bag="'+(b.bag?1:0)+'">b.key+(b.bag?'<span class="bag-tag">紙袋</span>':'')+' </button>';
  }).join('');
}

function setAdd(v){
  selAdd=v;
  document.getElementById('add-yes').classList.toggle('active',v==='yes');
  document.getElementById('add-no').classList.toggle('active',v==='no');
}

function addOrder(){
  var brands=BRAND_MASTER[farm]||[];
  var bObj=null;
  for(var i=0;i<brands.length;i++){if(brands[i].key===selBrand){bObj=brands[i];break;}}
  var isBag=bObj?bObj.bag:false;
  var ok=true;
  if(!isBag&&!selTank){document.getElementById('err-tank').classList.add('show');ok=false;}
  if(!selBrand){document.getElementById('err-brand').classList.add('show');ok=false;}
  if(!selQty||selQty<=0){document.getElementById('err-qty').classList.add('show');ok=false;}
  if(!ok)return;
  var staff=document.getElementById('staff-name').value.trim()||'未記入';
  var date=document.getElementById('delivery-date').value;
  if(!date){toast('配送日を選択してください');return;}
  orders.push({id:idCnt++,date:date,staff:staff,farm:farm,tank:selTank||'－',brand:selBrand,qty:selQty,additive:selAdd,isBag:isBag});
  saveDraft();renderOrders();resetForm();toast('注文を追加しました');
}

function resetForm(){
  selTank=null;selBrand=null;selQty=null;selAdd='no';
  renderTanks();renderBrands();
  document.querySelectorAll('.qty-chip').forEach(function(b){b.classList.remove('active');});
  document.getElementById('qty-other').value='';
  document.getElementById('add-yes').classList.remove('active');
  document.getElementById('add-no').classList.add('active');
  ['err-tank','err-brand','err-qty'].forEach(function(id){document.getElementById(id).classList.remove('show');});
}

function renderOrders(){
  document.getElementById('order-count').textContent=orders.length?'（'+orders.length+'件）':'';
  var list=document.getElementById('order-list');
  if(!orders.length){
    list.innerHTML='<div class="empty-lbl">まだ注文がありません</div>';
    document.getElementById('send-wrap').style.display='none';
    return;
  }
  document.getElementById('send-wrap').style.display='';
  list.innerHTML=orders.map(function(o){
    var fl=FARM_LABELS[o.farm]||o.farm;
    var bc=BADGE_CLS[o.farm]||'';
    var addLbl=o.additive==='yes'?'添加剤：有':'添加剤：無';
    var addCls=o.additive==='yes'?'add-yes':'add-no';
    return '<div class="order-item"><div class="oi-body"><div class="oi-main"><span class="badge '+bc+'">fl+'</span> タンク '+o.tank+' '+o.qty+'t</div><div class="oi-sub">'+o.brand+' <span class="badge '+addCls+'">addLbl+'</span>'+(o.isBag?' 紙袋':'')+'  担当：'+o.staff+'</div></div><button class="oi-del" data-id="'+o.id+'">x</button></div>';
  }).join('');
  list.onclick=function(e){
    var b=e.target.closest('.oi-del');
    if(!b)return;
    var id=parseInt(b.dataset.id);
    orders=orders.filter(function(o){return o.id!==id;});
    saveDraft();renderOrders();
  };
}

function submitOrders(){
  if(!orders.length)return;
  var btn=document.getElementById('btn-send');
  btn.textContent='送信中...';btn.disabled=true;
  var cbName='cb_'+Date.now();
  var script=document.createElement('script');
  window[cbName]=function(res){
    delete window[cbName];
    if(script.parentNode)document.body.removeChild(script);
    if(res&&res.result==='success'){
      orders=[];saveDraft();renderOrders();
      toast('送信しました '+res.count+'件');
      calLoaded=false;
    } else {
      toast('送信エラーが発生しました');
    }
    btn.textContent='送信';btn.disabled=false;
  };
  script.onerror=function(){
    delete window[cbName];
    if(script.parentNode)document.body.removeChild(script);
    toast('通信エラー');btn.textContent='送信';btn.disabled=false;
  };
  var payload=encodeURIComponent(JSON.stringify({orders:orders}));
  script.src=GAS_URL+'?action=post&data='+payload+'&callback='+cbName;
  document.body.appendChild(script);
}

function saveDraft(){try{localStorage.setItem('draft_orders',JSON.stringify(orders));}catch(e){}}
function loadDraft(){try{var r=localStorage.getItem('draft_orders');if(r)orders=JSON.parse(r);if(orders.length)renderOrders();}catch(e){orders=[];}}

function loadCalendar(){
  document.getElementById('month-label').textContent=calYear+'年'+(calMonth+1)+'月';
  document.getElementById('cal-grid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--muted);font-size:12px;">読み込み中...</div>';
  var cbName='cal_'+Date.now();
  var script=document.createElement('script');
  window[cbName]=function(res){
    delete window[cbName];
    if(script.parentNode)document.body.removeChild(script);
    if(res&&res.orders){
      calOrders=[];
      for(var i=0;i<res.orders.length;i++){
        var o=res.orders[i];
        var s=String(o['配送日']||'');
        if(s.indexOf('/')>=0)s=s.replace(/\//g,'-');
        s=s.substring(0,10);
        if(s&&String(o['農場']||'')){
          calOrders.push({
            date:s,
            farm:String(o['農場']||''),
            tank:String(o['タンク']||''),
            brand:String(o['銘柄']||''),
            qty:parseFloat(o['数量(t)'])||0,
            additive:o['添加剤']==='有'?'yes':'no',
            staff:String(o['担当者']||'')
          });
        }
      }
    } else {
      calOrders=[];
    }
    calLoaded=true;
    renderCalendar();
    renderPrevNext();
  };
  script.onerror=function(){
    delete window[cbName];
    if(script.parentNode)document.body.removeChild(script);
    document.getElementById('cal-grid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px;color:#c00;font-size:12px;">取得エラー</div>';
  };
  script.src=GAS_URL+'?action=get&callback='+cbName;
  document.body.appendChild(script);
}

function renderCalendar(){
  document.getElementById('month-label').textContent=calYear+'年'+(calMonth+1)+'月';
  var grid=document.getElementById('cal-grid');
  var today=new Date();
  var todayStr=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  var heads=['日','月','火','水','木','金','土'];
  var html='';
  for(var h=0;h<heads.length;h++){
    var hcls=h===0?' sun':h===6?' sat':'';
    html+='<div class="cal-head'+hcls+'">heads[h]+'</div>';
  }
  var first=new Date(calYear,calMonth,1);
  var last=new Date(calYear,calMonth+1,0);
  var startDow=first.getDay();
  for(var i=0;i<startDow;i++){
    var pd=new Date(calYear,calMonth,1-startDow+i);
    var pdow=pd.getDay();
    html+='<div class="cal-cell other"><div class="day-num'+(pdow===0?' sun':pdow===6?' sat':'')+'">pd.getDate()+'</div></div>';
  }
  for(var day=1;day<=last.getDate();day++){
    var dateStr=calYear+'-'+pad(calMonth+1)+'-'+pad(day);
    var dow=(startDow+day-1)%7;
    var dayOrders=[];
    for(var j=0;j<calOrders.length;j++){if(calOrders[j].date===dateStr)dayOrders.push(calOrders[j]);}
    var hasOrder=dayOrders.length>0;
    var isToday=dateStr===todayStr;
    var isSel=dateStr===selDate;
    var cls='cal-cell'+(hasOrder?' has-order':'')+(isSel?' selected':'');
    var numCls='day-num'+(dow===0?' sun':dow===6?' sat':'');
    var numHTML=isToday?'<span class="today-num">'+day+'</span>':''+day;
    var farms={};
    for(var k=0;k<dayOrders.length;k++){
      var f=dayOrders[k].farm;
      if(!farms[f])farms[f]=0;
      farms[f]++;
    }
    var dots='';
    var fkeys=Object.keys(farms);
    for(var fi=0;fi<fkeys.length;fi++){
      dots+='<div class="dot '+(FARM_DOT_CLS[fkeys[fi]]||'')+'"></div>';
    }
    var cntHTML=dayOrders.length>0?'<div class="cnt-lbl">'+dayOrders.length+'件</div>':'';
    html+='<div class="'+cls+'" data-date="'+dateStr+'" onclick="selectDate(\''+dateStr+'\')"><div class="'+numCls+'">numHTML+'</div><div class="dot-row">'+dots+'</div>'+cntHTML+'</div>';
  }
  var used=(startDow+last.getDate())%7;
  var remain=used===0?0:7-used;
  for(var ri=0;ri<remain;ri++){
    var rdow=(startDow+last.getDate()+ri)%7;
    html+='<div class="cal-cell other"><div class="day-num'+(rdow===6?' sat':'')+'">（ri+1)+'</div></div>';
  }
  grid.innerHTML=html;
}

function selectDate(dateStr){
  selDate=dateStr;
  var cells=document.querySelectorAll('.cal-cell');
  for(var i=0;i<cells.length;i++){
    if(cells[i].dataset.date===dateStr){cells[i].classList.add('selected');}
    else{cells[i].classList.remove('selected');}
  }
  showDetail(dateStr);
}

function showDetail(dateStr){
  var card=document.getElementById('detail-card');
  var dayOrders=[];
  for(var i=0;i<calOrders.length;i++){if(calOrders[i].date===dateStr)dayOrders.push(calOrders[i]);}
  if(!dayOrders.length){card.style.display='none';return;}
  card.style.display='';
  var dp=dateStr.split('-');
  var d=new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2]));
  var wd=['日','月','火','水','木','金','土'][d.getDay()];
  var totalQty=0;
  for(var i=0;i<dayOrders.length;i++){totalQty+=dayOrders[i].qty;}
  var tankCount={};
  for(var i=0;i<dayOrders.length;i++){
    var tk=dayOrders[i].tank;
    if(tk&&tk!=='－'){tankCount[tk]=(tankCount[tk]||0)+1;}
  }
  var dupTanks=[];
  var tkeys=Object.keys(tankCount);
  for(var i=0;i<tkeys.length;i++){if(tankCount[tkeys[i]]>1)dupTanks.push(tkeys[i]);}
  var warnHTML='';
  if(dupTanks.length){warnHTML='<div class="warn-box"><span style="font-size:16px;">!</span> タンク'+dupTanks.join('・')+'が重複しています</div>';}
  var rowsHTML='';
  for(var i=0;i<dayOrders.length;i++){
    var o=dayOrders[i];
    var isDup=o.tank&&tankCount[o.tank]>1;
    var bc=BADGE_CLS[o.farm]||'';
    var fl=FARM_LABELS[o.farm]||o.farm;
    rowsHTML+='<div class="det-row"><span class="badge '+bc+'">fl+'</span><div class="det-info"><div class="det-tank">タンク '+o.tank+(isDup?' <span style="color:#c00;font-size:10px;">重複</span>':'')+'</div><div class="det-brand">'+o.brand+' / '+o.staff+'</div></div><div><div class="det-qty">'+o.qty+'t</div>'+(o.additive==='yes'?'<div class="det-add">添加剤有</div>':'')+'</div></div>';
  }
  document.getElementById('detail-panel').innerHTML=
    '<div class="detail-date-lbl">'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+wd+'）<span class="detail-badge">'+dayOrders.length+'件 / '+totalQty.toFixed(1)+'t</span></div>'+
    warnHTML+rowsHTML;
}

function renderPrevNext(){
  var today=new Date();
  var todayStr=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  var dates={};
  for(var i=0;i<calOrders.length;i++){dates[calOrders[i].date]=true;}
  var sorted=Object.keys(dates).sort();
  var past=[],future=[];
  for(var i=0;i<sorted.length;i++){
    if(sorted[i]<todayStr)past.push(sorted[i]);
    else future.push(sorted[i]);
  }
  var prev=past.length?past[past.length-1]:null;
  var next=future.length?future[0]:null;
  function makeCard(label,arrow,dateStr){
    if(!dateStr){
      return '<div class="pn-card"><div class="pn-lbl">'+arrow+' '+label+'</div><div class="pn-date" style="color:var(--muted);">なし</div></div>';
    }
    var dp=dateStr.split('-');
    var d=new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2]));
    var wd=['日','月','火','水','木','金','土'][d.getDay()];
    var cnt=0,qty=0;
    for(var i=0;i<calOrders.length;i++){
      if(calOrders[i].date===dateStr){cnt++;qty+=calOrders[i].qty;}
    }
    return '<div class="pn-card"><div class="pn-lbl">'+arrow+' '+label+'</div><div class="pn-date">'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+wd+'）</div><div class="pn-cnt">'+cnt+'件 / '+qty.toFixed(1)+'t</div></div>';
  }
  document.getElementById('pn-grid').innerHTML=makeCard('前回','◀',prev)+makeCard('次回','▶',next);
}

function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('show');},2400);
}
</script>
</body>
</html>
