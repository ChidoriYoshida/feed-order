<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>飼料注文 管理・注文書</title>
<style>
:root{
  --navy:#1A3A5C;--blue:#2E6DA4;--green:#1D9E75;--green-d:#0f6e56;
  --farm0:#D6E8F7;--farm0h:#4472C4;--farm1:#E8E6FB;--farm1h:#7B66D6;--farm2:#FDE9C8;--farm2h:#ED7D31;
  --border:#d0d0cc;--text:#1a1a18;--muted:#777;
  --radius:10px;--shadow:0 2px 12px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;background:#eef2f7;color:var(--text);font-size:13px;}
.toolbar{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);flex-wrap:wrap;}
.toolbar h1{font-size:14px;font-weight:700;flex:1;letter-spacing:.04em;}
.tbtn{border:none;border-radius:6px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit;}
.tbtn-green{background:var(--green);color:#fff;}
.tbtn-blue{background:var(--blue);color:#fff;}
.tbtn-orange{background:#E67E22;color:#fff;}
.tbtn-gray{background:#ccc;color:#333;}
.tbtn-red{background:#c0392b;color:#fff;}
.tab-bar{background:#fff;border-bottom:2px solid var(--border);display:flex;position:sticky;top:48px;z-index:90;overflow-x:auto;}
.tab{padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;}
.tab.active{color:var(--navy);border-bottom-color:var(--navy);}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin:12px;padding:14px;}
.sec-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.sec-title::before{content:'';width:3px;height:13px;background:var(--blue);border-radius:2px;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px;}
.kpi{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;text-align:center;}
.kpi-label{font-size:10px;color:var(--muted);margin-bottom:4px;font-weight:600;}
.kpi-val{font-size:22px;font-weight:700;color:var(--navy);}
.kpi-unit{font-size:11px;color:var(--muted);}
.tbl-wrap{overflow-x:auto;}
table.otbl{width:100%;border-collapse:collapse;font-size:12px;}
table.otbl th{background:var(--navy);color:#fff;padding:6px 8px;text-align:center;font-size:11px;white-space:nowrap;}
table.otbl td{border-bottom:0.5px solid var(--border);padding:7px 8px;vertical-align:middle;}
table.otbl tr:hover td{background:#f0f5fb;}
.tr-f0 td{border-left:3px solid var(--farm0h);}
.tr-f1 td{border-left:3px solid var(--farm1h);}
.tr-f2 td{border-left:3px solid var(--farm2h);}
.tr-bag td{border-left:3px solid var(--blue);}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700;}
.bf0{background:var(--farm0);color:var(--farm0h);}
.bf1{background:var(--farm1);color:var(--farm1h);}
.bf2{background:var(--farm2);color:var(--farm2h);}
.add-yes{background:#E1F5EE;color:#0f6e56;}
.add-no{background:#f0f0f0;color:#888;}
.bag-tag{background:#e0e8f0;color:var(--blue);padding:2px 5px;border-radius:3px;font-size:10px;}
.btn-del{background:none;border:none;color:#c0392b;cursor:pointer;font-size:15px;padding:2px 5px;font-family:inherit;}
.truck-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:10px;}
.truck-head{background:var(--navy);color:#fff;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.truck-meta{font-size:11px;color:#9bb;display:flex;gap:10px;flex-wrap:wrap;}
.bar-outer{height:6px;background:#e0e0e0;}
.bar-inner{height:100%;transition:width .4s;}
.bar-green{background:var(--green);}
.bar-amber{background:#EF9F27;}
.bar-red{background:#c0392b;}
.titbl{width:100%;border-collapse:collapse;font-size:11.5px;}
.titbl th{background:#eef2f7;padding:5px 8px;text-align:center;font-size:10px;color:var(--muted);border-bottom:1px solid var(--border);}
.titbl td{padding:6px 8px;border-bottom:0.5px solid #eee;vertical-align:middle;}
.titbl tr:last-child td{border-bottom:none;}
.titbl td.tc{text-align:center;}
.titbl td.tr{text-align:right;}
.titbl td.fw{font-weight:700;}
.ttotal{background:#f5f7fa;border-top:1.5px solid var(--blue);font-weight:700;}
.mixed-tag{background:#ED7D31;color:#fff;font-size:10px;padding:2px 7px;border-radius:4px;font-weight:700;}
.rec-size{background:var(--green);color:#fff;font-size:11px;padding:2px 8px;border-radius:4px;font-weight:700;}
.os-page{width:190mm;margin:12px auto 0;background:#fff;padding:7mm 9mm;box-shadow:var(--shadow);}
.os-sep{width:190mm;margin:0 auto;height:8mm;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:10px;color:#aaa;border-left:1px dashed #ccc;border-right:1px dashed #ccc;}
.os-header{display:grid;grid-template-columns:45mm 1fr 45mm;align-items:start;margin-bottom:3mm;}
.os-company{font-size:13px;font-weight:700;letter-spacing:.05em;text-align:center;}
.os-title{font-size:12px;font-weight:700;letter-spacing:.12em;text-align:center;}
.os-right{text-align:right;font-size:10px;line-height:1.8;}
.os-date{font-size:13px;font-weight:700;}
.os-fax{font-size:9px;color:#444;margin-bottom:2mm;line-height:1.7;}
.os-delivery{display:flex;align-items:center;gap:4mm;margin-bottom:2mm;}
.os-delivery .dlabel{font-size:12px;font-weight:700;border:1.5px solid #000;padding:1px 4px;}
.os-delivery .ddate{font-size:14px;font-weight:700;}
.os-unit{margin-left:auto;font-size:10px;font-weight:600;}
table.ostbl{width:100%;border-collapse:collapse;font-size:9px;}
table.ostbl th,table.ostbl td{border:1px solid #666;text-align:center;padding:2px;vertical-align:middle;}
table.ostbl thead th{background:#ddd;font-weight:700;font-size:8px;line-height:1.3;}
table.ostbl .of0 td{background:#D6E8F7;}
table.ostbl .of1 td{background:#E8E6FB;}
table.ostbl .of2 td{background:#FDE9C8;}
table.ostbl .obag td{background:#EBF3FA;}
table.ostbl .ototal td{background:#1A3A5C;color:#fff;font-weight:700;}
table.ostbl .qval{font-size:11px;font-weight:700;color:#1A3A5C;}
table.ostbl .ototal .qval{color:#fff;}
.os-footer{display:flex;justify-content:space-between;align-items:flex-end;margin-top:3mm;}
.os-contact{font-size:10px;}
.os-sign{display:grid;grid-template-columns:repeat(3,28mm);gap:0;}
.sign-box .sh{background:#2E6DA4;color:#fff;text-align:center;padding:2px;font-size:8px;font-weight:700;}
.sign-box .sb{height:12mm;border:1px solid #999;}
.sign-box .sf{background:#f0f0f0;text-align:center;font-size:7px;color:#bbb;border:1px solid #bbb;border-top:none;}
.arch-item{border:0.5px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;}
.arch-main{font-size:13px;font-weight:600;color:var(--navy);}
.arch-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.arch-btn{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:600;font-family:inherit;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;border-radius:12px;padding:20px;width:90%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:15px;font-weight:700;margin-bottom:14px;color:var(--navy);}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.modal-field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
.modal-field select,.modal-field input{width:100%;padding:6px;border:1px solid var(--border);border-radius:6px;font-size:12px;font-family:inherit;}
.modal-btns{display:flex;gap:8px;margin-top:14px;}
@media print{
  .toolbar,.tab-bar,#tab-orders,#tab-plan,#tab-archive,.no-print{display:none!important;}
  body{background:#fff;}
  #tab-sheet{display:block!important;}
  .os-page{margin:0;box-shadow:none;padding:8mm 10mm;width:100%;page-break-after:always;}
  .os-sep{display:none!important;}
  @page{size:A4 portrait;margin:0;}
}
</style>
</head>
<body>
<div class="toolbar no-print">
  <h1>🚛 飼料注文 管理システム</h1>
  <button class="tbtn tbtn-green" id="btn-load" onclick="loadOrders()">🔄 注文を取得</button>
  <button class="tbtn tbtn-blue"  id="btn-plan" onclick="runOptimize()">⚡ 配車計画</button>
  <button class="tbtn tbtn-blue"  id="btn-sheet" onclick="buildSheet();switchTab('sheet')" disabled>📄 注文書作成</button>
  <button class="tbtn tbtn-orange" onclick="printAndArchive()">🖨 印刷・完了</button>
  <button class="tbtn tbtn-gray"  onclick="switchTab('archive');loadArchive()">📁 過去の注文書</button>
</div>
<div class="tab-bar no-print">
  <div class="tab active" id="t-orders" onclick="switchTab('orders')">受信注文</div>
  <div class="tab" id="t-plan"   onclick="switchTab('plan')">配車計画</div>
  <div class="tab" id="t-sheet"  onclick="switchTab('sheet')">注文書確認</div>
  <div class="tab" id="t-archive" onclick="switchTab('archive');loadArchive()">📁 過去の注文書</div>
</div>

<div id="tab-orders">
  <div class="kpi-grid">
    <div class="kpi"><div class="kpi-label">表示件数</div><div class="kpi-val" id="k-cnt">0</div><div class="kpi-unit">件</div></div>
    <div class="kpi"><div class="kpi-label">タンク製品</div><div class="kpi-val" id="k-tank">0.0</div><div class="kpi-unit">t</div></div>
    <div class="kpi"><div class="kpi-label">紙袋製品</div><div class="kpi-val" id="k-bag">0.0</div><div class="kpi-unit">t</div></div>
    <div class="kpi"><div class="kpi-label">想定台数</div><div class="kpi-val" id="k-trucks">-</div><div class="kpi-unit">台</div></div>
  </div>
  <div class="card">
    <div class="sec-title">受信注文一覧　<span style="font-size:11px;font-weight:400;color:var(--muted);">※表示中の注文のみ配車計画されます</span></div>
    <div style="margin-bottom:8px;display:flex;gap:8px;flex-wrap:wrap;">
      <input type="date" id="filter-date" onchange="filterOrders()" style="border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px;">
      <button class="tbtn tbtn-gray" onclick="clearFilter()">全表示</button>
      <button class="tbtn tbtn-red" onclick="clearAll()" style="margin-left:auto;">🗑 全削除</button>
    </div>
    <div class="tbl-wrap">
      <table class="otbl">
        <thead><tr>
          <th>農場</th><th>配送日</th><th>タンク</th><th>銘柄</th><th>数量</th><th>添加剤</th><th>担当者</th><th>編集</th><th>削除</th>
        </tr></thead>
        <tbody id="orders-tbody">
          <tr><td colspan="9" style="text-align:center;padding:20px;color:var(--muted);">「注文を取得」ボタンを押してください</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="card">
    <div class="sec-title">手動追加</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px;">
      <div class="modal-field"><label>農場</label>
        <select id="m-farm" onchange="onMFarmChange()">
          <option value="古井農場">①古井農場</option>
          <option value="第2農場">②第2農場</option>
          <option value="第3農場">③第3農場</option>
        </select>
      </div>
      <div class="modal-field"><label>配送日</label><input type="date" id="m-date"></div>
      <div class="modal-field"><label>タンク</label><select id="m-tank"></select></div>
      <div class="modal-field"><label>銘柄</label><select id="m-brand"></select></div>
      <div class="modal-field"><label>数量(t)</label><input type="number" id="m-qty" min="0.5" max="12" step="0.5" placeholder="例:4"></div>
      <div class="modal-field"><label>添加剤</label>
        <select id="m-add"><option value="no">無</option><option value="yes">有</option></select>
      </div>
    </div>
    <button class="tbtn tbtn-blue" onclick="manualAdd()">+ 追加</button>
  </div>
</div>

<div id="tab-plan" style="display:none;">
  <div id="plan-wrap" style="margin:12px;">
    <div class="card"><div style="text-align:center;padding:20px;color:var(--muted);">「配車計画」ボタンを押してください</div></div>
  </div>
</div>

<div id="tab-sheet" style="display:none;">
  <div style="margin:8px 12px;display:flex;gap:8px;flex-wrap:wrap;" class="no-print">
    <button class="tbtn tbtn-orange" onclick="printAndArchive()">🖨 印刷して完了</button>
    <button class="tbtn tbtn-blue"   onclick="window.print()">🖨 印刷のみ</button>
    <div style="font-size:11px;color:var(--muted);align-self:center;">印刷して完了で自動削除・履歴保存されます</div>
  </div>
  <div id="sheet-wrap"></div>
</div>

<div id="tab-archive" style="display:none;">
  <div class="card">
    <div class="sec-title">過去の注文書(1ヶ月間保存)</div>
    <div id="archive-list"><div style="text-align:center;padding:20px;color:var(--muted);">読み込み中...</div></div>
  </div>
</div>

<!-- 編集モーダル -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal-box">
    <div class="modal-title">注文を編集</div>
    <div class="modal-grid">
      <div class="modal-field"><label>農場</label>
        <select id="e-farm" onchange="onEFarmChange()">
          <option value="古井農場">①古井農場</option>
          <option value="第2農場">②第2農場</option>
          <option value="第3農場">③第3農場</option>
        </select>
      </div>
      <div class="modal-field"><label>配送日</label><input type="date" id="e-date"></div>
      <div class="modal-field"><label>タンク</label><select id="e-tank"></select></div>
      <div class="modal-field"><label>銘柄</label><select id="e-brand"></select></div>
      <div class="modal-field"><label>数量(t)</label><input type="number" id="e-qty" min="0.5" max="12" step="0.5"></div>
      <div class="modal-field"><label>添加剤</label>
        <select id="e-add"><option value="no">無</option><option value="yes">有</option></select>
      </div>
    </div>
    <div class="modal-btns">
      <button class="tbtn tbtn-blue"  style="flex:1;" onclick="saveEdit()">保存</button>
      <button class="tbtn tbtn-red"   style="flex:1;" onclick="deleteFromModal()">この注文を削除</button>
      <button class="tbtn tbtn-gray"  style="flex:1;" onclick="closeEdit()">キャンセル</button>
    </div>
  </div>
</div>
  <script>
var TANK_MASTER={
  '古井農場':[{no:'11',house:'育成'},{no:'12',house:'育成'},{no:'21',house:'母豚'},{no:'22',house:'母豚'},{no:'23',house:'母豚'},{no:'24',house:'母豚'},{no:'25',house:'母豚'},{no:'26',house:'母豚'},{no:'27',house:'母豚'},{no:'28',house:'母豚'},{no:'29',house:'母豚'},{no:'30',house:'母豚'},{no:'31',house:'分娩'},{no:'32',house:'分娩'},{no:'33',house:'分娩'},{no:'34',house:'分娩'},{no:'35',house:'分娩'},{no:'36',house:'分娩'},{no:'37',house:'分娩'},{no:'38',house:'分娩'},{no:'41',house:'子豚'},{no:'42',house:'子豚'},{no:'43',house:'子豚'},{no:'44',house:'子豚'}],
  '第2農場':[{no:'50',house:'201'},{no:'51',house:'202-203'},{no:'52',house:'204'},{no:'53',house:'205-206'},{no:'54',house:'207-208'},{no:'55',house:'209'},{no:'56',house:'210-211'},{no:'57',house:'212-213'},{no:'58',house:'214-215'},{no:'59',house:'216-217'}],
  '第3農場':[{no:'A-1',house:'301'},{no:'A-2',house:'301'},{no:'A-3',house:'302'},{no:'A-4',house:'302'},{no:'B-1',house:'303'},{no:'B-2',house:'303'},{no:'B-3',house:'304'},{no:'B-4',house:'304'},{no:'C-1',house:'305'},{no:'C-2',house:'305'},{no:'C-3',house:'306'},{no:'C-4',house:'306'},{no:'D-1',house:'307'},{no:'D-2',house:'307'},{no:'D-3',house:'308'},{no:'D-4',house:'308'},{no:'E-1',house:'309'},{no:'E-2',house:'309'},{no:'E-3',house:'310'},{no:'E-4',house:'310'},{no:'F-1',house:'311'},{no:'F-2',house:'311'},{no:'F-3',house:'312'},{no:'F-4',house:'312'}]
};
var BAG_BRANDS=['ママコロ餌付','ママコロ前期','ミュー前期','やまとX'];
var BRAND_MASTER={
  '古井農場':['シンサウメイク','たから母豚','たから授乳','たから12','たから20PL','たから40PL','たから70PL','ママコロ餌付','ママコロ前期','ミュー前期','やまとX'],
  '第2農場':['たから20PL','たから40PL','たから70PL'],
  '第3農場':['たから20PL','たから40PL','たから70PL']
};
var TANK_BRANDS=['たから12','たから20PL','たから40PL','たから70PL','たから母豚','たから授乳','シンサウメイク'];
var ALL_BRANDS=TANK_BRANDS.concat(BAG_BRANDS);
var FARM_LABELS={'古井農場':'①古井農場','第2農場':'②第2農場','第3農場':'③第3農場'};
var FARM_IDX={'古井農場':0,'第2農場':1,'第3農場':2};
var TRUCK_SIZES=[2,3,4,5,6,7,8];
var MAX_T=12;
var GAS_URL='https://script.google.com/macros/s/AKfycbyTBTPjewF9RDfODEXEmReu06WxctAJ7i8C8SWEs9B3n8JnSPpJ7O4R_5JqUXWXrZRV/exec';

var allOrders=[],plan=[],dispOrders=[],idCnt=1,currentPlan=null,editingId=null;

function pad(n){return String(n).padStart(2,'0');}

function switchTab(name){
  ['orders','plan','sheet','archive'].forEach(function(n){
    document.getElementById('tab-'+n).style.display=n===name?'':'none';
    document.getElementById('t-'+n).classList.toggle('active',n===name);
  });
}

function loadOrders(){
  var btn=document.getElementById('btn-load');
  btn.textContent='取得中...';btn.disabled=true;
  gasCall('get',null,function(res){
    btn.textContent='🔄 注文を取得';btn.disabled=false;
    if(!res||!res.orders){showToast('取得エラー');return;}
    var raw=res.orders.map(function(o,i){
      return{
        id:String(o['ID']||(idCnt+i)),
        date:parseDate(o['配送日']),
        staff:String(o['担当者']||''),
        farm:String(o['農場']||''),
        tank:String(o['タンク']||''),
        brand:String(o['銘柄']||''),
        qty:parseFloat(o['数量(t)'])||0,
        additive:o['添加剤']==='有'?'yes':'no',
        isBag:o['紙袋']==='紙袋'
      };
    }).filter(function(o){return o.farm&&o.brand&&o.qty>0;});
    var existIds=new Set(allOrders.map(function(o){return o.id;}));
    var newOnes=raw.filter(function(o){return!existIds.has(o.id);});
    allOrders=allOrders.concat(newOnes);
    dispOrders=allOrders.slice();
    renderOrdersTable(dispOrders);
    updateKPI();
    showToast(newOnes.length+'件の注文を取得しました');
  });
}

function parseDate(v){
  var s=String(v||'').trim();
  if(!s)return'';
  s=s.replace(/\//g,'-');
  var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+pad(parseInt(m[2]))+'-'+pad(parseInt(m[3]));
  return s.substring(0,10);
}

function fmtDate(s){
  if(!s)return'';
  var p=String(s).split('-');
  if(p.length<3)return s;
  var d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  var wd=['日','月','火','水','木','金','土'][d.getDay()];
  return(d.getMonth()+1)+'/'+d.getDate()+'('+wd+')';
}

function filterOrders(){
  var d=document.getElementById('filter-date').value;
  dispOrders=d?allOrders.filter(function(o){return o.date===d;}):allOrders.slice();
  renderOrdersTable(dispOrders);updateKPI();
}
function clearFilter(){
  document.getElementById('filter-date').value='';
  dispOrders=allOrders.slice();
  renderOrdersTable(dispOrders);updateKPI();
}

function updateKPI(){
  var tankQty=dispOrders.filter(function(o){return!o.isBag;}).reduce(function(s,o){return s+Number(o.qty);},0);
  var bagQty=dispOrders.filter(function(o){return o.isBag;}).reduce(function(s,o){return s+Number(o.qty);},0);
  var estTrucks=Math.ceil(tankQty/MAX_T);
  document.getElementById('k-cnt').textContent=dispOrders.length;
  document.getElementById('k-tank').textContent=tankQty.toFixed(1);
  document.getElementById('k-bag').textContent=bagQty.toFixed(1);

function runOptimize(){
  if(!dispOrders.length){showToast('表示中の注文がありません');return;}
  var dates=[];
  dispOrders.forEach(function(o){if(dates.indexOf(o.date)<0)dates.push(o.date);});
  dates.sort();
  var trucks=[];
  dates.forEach(function(date){
    var items=dispOrders.filter(function(o){return o.date===date&&!o.isBag;}).slice().sort(function(a,b){return b.qty-a.qty;});
    items.forEach(function(o){
      var placed=false;
      for(var i=0;i<trucks.length;i++){
        if(trucks[i].date!==date)continue;
        var used=trucks[i].items.reduce(function(s,x){return s+Number(x.qty);},0);
        if(used+Number(o.qty)<=MAX_T){trucks[i].items.push(o);placed=true;break;}
      }
      if(!placed)trucks.push({date:date,items:[o]});
    });
  });
  trucks.forEach(function(t,i){
    t.id=i+1;
    t.usedQty=t.items.reduce(function(s,x){return s+Number(x.qty);},0);
    t.recSize=TRUCK_SIZES.filter(function(s){return s>=t.usedQty;})[0]||8;
    var farms=[];t.items.forEach(function(o){if(farms.indexOf(o.farm)<0)farms.push(o.farm);});
    t.farms=farms.sort(function(a,b){return FARM_IDX[a]-FARM_IDX[b];});
    t.mixed=t.farms.length>1;
  });
  plan=trucks;currentPlan={trucks:plan,dispOrders:dispOrders.slice()};
  renderPlan();
  document.getElementById('btn-sheet').disabled=false;
  switchTab('plan');
}

function printAndArchive(){
  if(!plan.length){showToast('先に注文書を作成してください');return;}
  if(!confirm('印刷後、受信注文を確定済みにしてアーカイブに保存します。よろしいですか？'))return;
  window.print();
  var ids=dispOrders.map(function(o){return o.id;});
  gasCall('mark_confirmed',{ids:ids},function(res){
    if(res&&res.result==='success')showToast(res.confirmed+'件を確定済みにしました');
  });
  var dates=[];dispOrders.forEach(function(o){if(dates.indexOf(o.date)<0)dates.push(o.date);});
  var payload={trucks:plan,orders:dispOrders};
  dates.forEach(function(date){
    gasCall('save_archive',{date:date,payload:payload},function(){});
  });
  var dispIds=new Set(dispOrders.map(function(o){return o.id;}));
  allOrders=allOrders.filter(function(o){return!dispIds.has(o.id);});
  dispOrders=[];plan=[];currentPlan=null;
  renderOrdersTable([]);updateKPI();
  document.getElementById('sheet-wrap').innerHTML='';
  document.getElementById('btn-sheet').disabled=true;
  switchTab('orders');
  showToast('完了！過去の注文書はアーカイブで確認できます。');
}

function gasCall(action,data,cb){
  var cbName='cb_'+Date.now()+'_'+Math.floor(Math.random()*9999);
  var script=document.createElement('script');
  window[cbName]=function(res){delete window[cbName];if(script.parentNode)document.body.removeChild(script);cb(res);};
  script.onerror=function(){delete window[cbName];if(script.parentNode)document.body.removeChild(script);cb(null);};
  var url=GAS_URL+'?action='+action+'&callback='+cbName;
  if(data)url+='&data='+encodeURIComponent(JSON.stringify(data));
  script.src=url;document.body.appendChild(script);
}

var toastTimer;
function showToast(msg){
  var t=document.getElementById('_toast');
  if(!t){t=document.createElement('div');t.id='_toast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(40px);background:#1A3A5C;color:#fff;padding:9px 20px;border-radius:20px;font-size:12px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap;';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(-50%) translateY(40px)';},3000);
}
</script>
</body>
</html>
