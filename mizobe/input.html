<style>

.pn-cnt{font-size:10px;color:var(--muted);margin-top:2px;}
.pred-row{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;border-bottom:0.5px solid var(--border);gap:8px;}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(50px);background:var(--navy);color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:200;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app-bar">

<script>
/* パスワード保護 */
(function(){
  var PASS='Mizobe1';
  var VIEW_PASS='MizobeF';
  /* ?reset=1 でlocalStorageをクリア */
  if(location.search.indexOf('reset=1')>=0){
    localStorage.removeItem('auth');
    location.href=location.pathname;
    return;
  }
  var stored=localStorage.getItem('auth');
  if(stored===PASS)return;
  if(stored===VIEW_PASS)return;
  var entered=prompt('パスワードを入力してください');
  if(entered===PASS){
    localStorage.setItem('auth',PASS);
  } else if(entered===VIEW_PASS){
    localStorage.setItem('auth',VIEW_PASS);
  } else {
    document.body.innerHTML='<div style="text-align:center;padding:40px;font-family:sans-serif;"><p style="color:#c00;font-size:16px;">パスワードが違います。ページを再読み込みしてください。</p></div>';
  }
})();
var VIEW_MODE=localStorage.getItem('auth')==='MizobeF';
var TANK_BRAND_LIMIT={
  '1':['リキッド70'],
  '2':['リキッド70'],
  '3':['リキッド70'],
  '4':['リキッド20'],
  '5':['リキッド20'],
  '6':['リキッド70','リキッド20','リキッド12','リキッド母豚','リキッド授乳'],
  '7':['リキッド70','リキッド20','リキッド12','リキッド母豚','リキッド授乳'],
  '20':['リキッド20','リキッド12'],
  '21':['リキッド20','リキッド12'],
  '22':['リキッド母豚','リキッド授乳'],
  '23':['リキッド母豚','リキッド授乳']
};
var TANK_MAX_QTY={'1':20,'2':20,'3':20,'4':20,'5':20,'6':20,'7':10,'20':10,'21':10,'22':10,'23':10};
var FARMS={
  mizobe:{label:'溝辺農場',badge:'bf0',dot:'d0',cls:'sel-mizobe',
    tanks:[{no:'1',house:'20t'},{no:'2',house:'20t'},{no:'3',house:'20t'},{no:'4',house:'20t'},{no:'5',house:'20t'},{no:'6',house:'20t'},{no:'7',house:'10t'},{no:'20',house:'10t'},{no:'21',house:'10t'},{no:'22',house:'10t'},{no:'23',house:'10t'}],
    brands:[{key:'リキッド70',bag:false},{key:'リキッド20',bag:false},{key:'リキッド12',bag:false},{key:'リキッド母豚',bag:false},{key:'リキッド授乳',bag:false},{key:'ミュー餌付',bag:true},{key:'ミュー前期',bag:true},{key:'ママコロ餌付',bag:true},{key:'九州やまとX',bag:true}],
    auto:{}
  }
};

var BAG_BRANDS=['ミュー餌付','ミュー前期','ママコロ餌付','九州やまとX'];
var MAX_PER_TRUCK=10;
var MAX_TOTAL=20;
var MAX_BAG_PER_TRUCK=null;
var WARN_THRESHOLD=16;
var GAS_URL='https://script.google.com/macros/s/AKfycbxzym0Va-wxjho6AuCpDaVHmPGBdUIzZ13jnjHyZgPKL5lUpX5E8xfDgh3L-uKh9qW2/exec';

var farmKey='mizobe';
var selTank=null,selBrand=null,selQty=null,selAdd='no',selNextDay='no';
var orders=[],idCnt=1,toastTimer;
var calYear=0,calMonth=0,calOrders=[],calMemos={},calLoaded=false,selDate=null,currentDetailDate=null;

function pad(n){return String(n).padStart(2,'0');}

function isBagBrand(key){return BAG_BRANDS.indexOf(key)>=0;}

function showTab(name){
  document.getElementById('tab-input').style.display=name==='input'?'':'none';
  document.getElementById('tab-cal').style.display=name==='cal'?'':'none';
  document.getElementById('tab-input-btn').classList.toggle('active',name==='input');
  document.getElementById('tab-cal-btn').classList.toggle('active',name==='cal');
  if(name==='cal'&&!calLoaded){loadCalendar();}
}

document.addEventListener('DOMContentLoaded',function(){
  var t=new Date();
  calYear=t.getFullYear();calMonth=t.getMonth();
  document.getElementById('delivery-date').value=t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());
  updateDateBand();
  document.getElementById('delivery-date').addEventListener('change',updateDateBand);

  /* 閲覧モードの場合は入力タブを非表示にする */
  if(VIEW_MODE){
    /* 注文入力タブを非表示 */
    document.getElementById('tab-input').style.display='none';
    document.getElementById('tab-input-btn').style.display='none';
    /* カレンダータブを表示・アクティブに */
    showTab('cal');
    /* 閲覧モード表示バナーを追加 */
    var banner=document.createElement('div');
    banner.style.cssText='background:#6B4BA3;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:700;display:flex;justify-content:center;align-items:center;gap:12px;';
    banner.innerHTML='👁 閲覧モード（注文の入力はできません）'
      +'<button onclick="var p=prompt(\'通常モードのパスワードを入力\');if(p===\'Mizobe1\'){localStorage.setItem(\'auth\',\'Mizobe1\');location.reload();}" style="background:#fff;color:#6B4BA3;border:none;border-radius:4px;padding:3px 10px;cursor:pointer;font-size:11px;font-weight:700;">🔓 切替</button>';
    document.body.insertBefore(banner,document.body.firstChild);
  }

  document.getElementById('tank-grid').addEventListener('click',function(e){
    var b=e.target;
    while(b&&!b.classList.contains('tank-btn')){b=b.parentElement;}
    if(!b)return;
    selTank=selTank===b.dataset.no?null:b.dataset.no;
    document.querySelectorAll('.tank-btn').forEach(function(x){x.classList.remove('active');});
    if(selTank){b.classList.add('active');}
    selBrand=null;
    document.getElementById('err-tank').classList.remove('show');
    renderBrands();updateQtyUI();
  });

  document.getElementById('brand-list').addEventListener('click',function(e){
    var b=e.target;
    while(b&&!b.classList.contains('brand-btn')){b=b.parentElement;}
    if(!b)return;
    selBrand=selBrand===b.dataset.key?null:b.dataset.key;
    document.querySelectorAll('.brand-btn').forEach(function(x){x.classList.remove('active');});
    if(selBrand)b.classList.add('active');
    document.getElementById('err-brand').classList.remove('show');
    updateQtyUI();
  });

  document.getElementById('qty-other').addEventListener('input',function(){
    var v=parseFloat(this.value);
    selQty=isNaN(v)?null:v;
    document.getElementById('err-qty').classList.remove('show');
    document.getElementById('err-qty-max').classList.remove('show');
  });

  document.getElementById('add-yes').addEventListener('click',function(){setAdd('yes');});
  document.getElementById('add-no').addEventListener('click',function(){setAdd('no');});
  document.getElementById('nextday-yes').addEventListener('click',function(){setNextDay('yes');});
  document.getElementById('nextday-no').addEventListener('click',function(){setNextDay('no');});
  document.getElementById('btn-add').addEventListener('click',addOrder);
  document.getElementById('btn-send').addEventListener('click',submitOrders);

  document.getElementById('prev-month').addEventListener('click',function(){
    calMonth--;if(calMonth<0){calMonth=11;calYear--;}calLoaded=false;loadCalendar();
  });
  document.getElementById('next-month').addEventListener('click',function(){
    calMonth++;if(calMonth>11){calMonth=0;calYear++;}calLoaded=false;loadCalendar();
  });

  loadDraft();renderTanks();renderBrands();updateQtyUI();
});

function updateDateBand(){
  var v=document.getElementById('delivery-date').value;
  if(!v){document.getElementById('date-band').textContent='日付を選択してください';return;}
  var p=v.split('-');
  var d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  var wd=['日','月','火','水','木','金','土'][d.getDay()];
  document.getElementById('date-band').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日('+wd+')の配送';
}

function updateQtyUI(){
  var isBag=selBrand&&isBagBrand(selBrand);
  var labelEl=document.getElementById('qty-label');
  var otherEl=document.getElementById('qty-other');
  var tankField=document.getElementById('field-tank');
  if(isBag){
    labelEl.textContent='数量（袋）';
    otherEl.placeholder='袋数を入力';
    otherEl.min='1';otherEl.step='1';otherEl.removeAttribute('max');
    tankField.style.display='none';
  } else {
    var max=selTank?TANK_MAX_QTY[selTank]:null;
    labelEl.textContent='数量（t）'+(max?'　上限'+max+'t':'');
    otherEl.placeholder=max?'1〜'+max+'の数量を入力':'数量を入力';
    otherEl.min='1';otherEl.step='1';
    if(max)otherEl.max=String(max);else otherEl.removeAttribute('max');
    tankField.style.display='';
  }
  selQty=null;
  document.getElementById('qty-other').value='';
}

function renderTanks(){
  var tanks=FARMS[farmKey].tanks;
  document.getElementById('tank-grid').innerHTML=tanks.map(function(t){
    return '<button class="tank-btn'+(selTank===t.no?' active':'')+'" data-no="'+t.no+'" data-house="'+t.house+'">'+t.no+'<br><span style="font-size:9px;opacity:.7">上限'+t.house+'</span></button>';
  }).join('');
}

function renderBrands(){
  var brands=FARMS[farmKey].brands;
  var limit=selTank?TANK_BRAND_LIMIT[selTank]:null;
  var filtered=limit?brands.filter(function(b){return limit.indexOf(b.key)>=0;}):brands;
  document.getElementById('brand-list').innerHTML=filtered.map(function(b){
    return '<button class="brand-btn'+(selBrand===b.key?' active':'')+'" data-key="'+b.key+'" data-bag="'+(b.bag?1:0)+'">'+
      b.key+(b.bag?'<span class="bag-tag">紙袋</span>':'')+' </button>';
  }).join('');
  if(limit&&filtered.length===1&&!selBrand){
    selBrand=filtered[0].key;
    setTimeout(function(){
      var btn=document.querySelector('.brand-btn');
      if(btn)btn.classList.add('active');
    },10);
  }
}

function setAdd(v){
  selAdd=v;
  document.getElementById('add-yes').classList.toggle('active',v==='yes');
  document.getElementById('add-no').classList.toggle('active',v==='no');
}

function setNextDay(v){
  selNextDay=v;
  document.getElementById('nextday-yes').classList.toggle('active',v==='yes');
  document.getElementById('nextday-no').classList.toggle('active',v==='no');
}

function addOrder(){
  var fm=FARMS[farmKey];
  var bObj=null;
  for(var i=0;i<fm.brands.length;i++){if(fm.brands[i].key===selBrand){bObj=fm.brands[i];break;}}
  var isBag=bObj?bObj.bag:false;
  var ok=true;
  if(!isBag&&!selTank){document.getElementById('err-tank').classList.add('show');ok=false;}
  if(!selBrand){document.getElementById('err-brand').classList.add('show');ok=false;}
  if(!selQty||selQty<=0){document.getElementById('err-qty').classList.add('show');ok=false;}
  if(!isBag&&selTank&&selQty&&TANK_MAX_QTY[selTank]&&selQty>TANK_MAX_QTY[selTank]){document.getElementById('err-qty-max').classList.add('show');ok=false;}
  if(!ok)return;
  var staff=document.getElementById('staff-name').value.trim()||'未記入';
  var date=document.getElementById('delivery-date').value;
  if(!date){toast('配送日を選択してください');return;}
  var unit=isBag?'袋':'t';
  orders.push({
    id:idCnt++,date:date,staff:staff,
    farm:fm.label,tank:isBag?'-':selTank,
    brand:selBrand,qty:selQty,unit:unit,
    additive:selAdd,isBag:isBag,nextDay:selNextDay
  });
  saveDraft();renderOrders();resetForm();toast('注文を追加しました');
}

function resetForm(){
  selTank=null;selBrand=null;selQty=null;selAdd='no';selNextDay='no';
  renderTanks();renderBrands();updateQtyUI();
  document.getElementById('add-yes').classList.remove('active');
  document.getElementById('add-no').classList.add('active');
  document.getElementById('nextday-yes').classList.remove('active');
  document.getElementById('nextday-no').classList.add('active');
  ['err-tank','err-brand','err-qty','err-qty-max'].forEach(function(id){
    document.getElementById(id).classList.remove('show');
  });
}

function renderOrders(){
  var cnt=document.getElementById('order-count');
  cnt.textContent=orders.length?'('+orders.length+'件)':'';
  var list=document.getElementById('order-list');
  if(!orders.length){
    list.innerHTML='<div class="empty-lbl">まだ注文がありません</div>';
    document.getElementById('send-wrap').style.display='none';
    return;
  }
  document.getElementById('send-wrap').style.display='';
  list.innerHTML=orders.map(function(o){
    var fk=Object.keys(FARMS).find(function(k){return FARMS[k].label===o.farm;})||'mizobe';
    var bc=FARMS[fk].badge;
    var fl=o.farm;
    var qtyDisp=o.qty+(o.isBag?'袋':'t');
    var addCls=o.additive==='yes'?'add-yes':'add-no';
    var addLbl=o.additive==='yes'?'添加剤有':'添加剤無';
    var nextDayLbl=o.nextDay==='yes'?' <span class="badge add-yes">翌日配達可</span>':'';
    var itemCls=o.isBag?'order-item bag-item':'order-item';
    return '<div class="'+itemCls+'">'+
      '<div class="oi-body">'+
        '<div class="oi-main"><span class="badge '+bc+'">'+fl+'</span> '+(o.isBag?'紙袋':'タンク '+o.tank)+' '+qtyDisp+'</div>'+
        '<div class="oi-sub">'+o.brand+' <span class="badge '+addCls+'">'+addLbl+'</span>'+nextDayLbl+' 担当:'+o.staff+'</div>'+
      '</div>'+
      '<button class="oi-del" data-id="'+o.id+'">x</button>'+
    '</div>';
  }).join('');
  list.onclick=function(e){
    var b=e.target;
    while(b&&!b.classList.contains('oi-del')){b=b.parentElement;}
    if(!b)return;
    var id=parseInt(b.dataset.id);
    orders=orders.filter(function(o){return o.id!==id;});
    saveDraft();renderOrders();
  };
}

function submitOrders(){
  if(!orders.length)return;
  var btn=document.getElementById('btn-send');
  btn.textContent='送信中...';btn.disabled=true;
  var cbName='cb_'+Date.now();
  var script=document.createElement('script');
  window[cbName]=function(res){
    delete window[cbName];
    if(script.parentNode)document.body.removeChild(script);
    if(res&&res.result==='success'){
      orders=[];saveDraft();renderOrders();
      toast(res.count+'件を送信しました');
      calLoaded=false;
    } else {toast('送信エラー');}
    btn.textContent='注文担当者へ送信';btn.disabled=false;
  };
  script.onerror=function(){
    delete window[cbName];
    if(script.parentNode)document.body.removeChild(script);
    toast('通信エラー');btn.textContent='送信';btn.disabled=false;
  };
  var payload=encodeURIComponent(JSON.stringify({orders:orders}));
  script.src=GAS_URL+'?action=post&data='+payload+'&callback='+cbName;
  document.body.appendChild(script);
}

function saveDraft(){try{localStorage.setItem('draft_orders',JSON.stringify(orders));}catch(e){}}
function loadDraft(){try{var r=localStorage.getItem('draft_orders');if(r)orders=JSON.parse(r);if(orders.length)renderOrders();}catch(e){orders=[];}}

function deleteOrder(id){
  if(!confirm('この注文を削除しますか？'))return;
  var cbName='del_'+Date.now();
  var script=document.createElement('script');
  window[cbName]=function(res){
    delete window[cbName];
    if(script.parentNode)document.body.removeChild(script);
    if(res&&res.result==='success'){
      /* calOrdersから該当IDを削除してカレンダーを再描画 */
      calOrders=calOrders.filter(function(o){return String(o.id)!==String(id);});
      calLoaded=false;
      loadCalendar();
      /* 詳細パネルも更新 */
      if(currentDetailDate)showDetail(currentDetailDate);
      toast('注文を削除しました');
    }else{
      toast('削除に失敗しました');
    }
  };
  script.onerror=function(){delete window[cbName];if(script.parentNode)document.body.removeChild(script);toast('削除エラー');};
  script.src=GAS_URL+'?action=delete_printed&data='+encodeURIComponent(JSON.stringify({ids:[id]}))+'&callback='+cbName;
  document.body.appendChild(script);
}

function loadCalendar(){
  document.getElementById('month-label').textContent=calYear+'年'+(calMonth+1)+'月';
  document.getElementById('cal-grid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--muted);font-size:12px;">読み込み中...</div>';
  var cbName='cal_'+Date.now();
  var script=document.createElement('script');
  window[cbName]=function(res){
    delete window[cbName];
    if(script.parentNode)document.body.removeChild(script);
    calOrders=[];calMemos={};
    if(res&&res.orders){
      for(var i=0;i<res.orders.length;i++){
        var o=res.orders[i];
        var s=String(o['\u914d\u9001\u65e5']||'');
        if(s.indexOf('/')>=0)s=s.replace(/\//g,'-');
        s=s.substring(0,10);
        var f=String(o['\u8fb2\u5834']||'');
        if(s&&f){
          var isBag=o['\u7d19\u888b']==='紙袋';
          var qtyVal=parseFloat(o['\u6570\u91cf(t)'])||0;
          calOrders.push({
            id:String(o['ID']||''),
            date:s,farm:f,
            tank:String(o['\u30bf\u30f3\u30af']||''),
            brand:String(o['銘柄']||''),
            qty:qtyVal,
            unit:isBag?'袋':'t',
            isBag:isBag,
            additive:o['\u6dfb\u52a0\u5264']==='\u6709'?'yes':'no',
            nextDay:o['\u7fcc\u65e5\u914d\u9054']==='\u53ef'?'yes':'no',
            staff:String(o['\u62c5\u5f53\u8005']||''),
            confirmed:String(o['\u78ba\u5b9a\u6e08\u307f']||'')==='\u78ba\u5b9a'
          });
        }
      }
    }
    if(res&&res.memos){calMemos=res.memos||{};}
    calLoaded=true;renderCalendar();renderPrevNext();renderPredictions();
  };
  script.onerror=function(){
    delete window[cbName];
    if(script.parentNode)document.body.removeChild(script);
    document.getElementById('cal-grid').innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px;color:#c00;font-size:12px;">取得エラー</div>';
  };
  script.src=GAS_URL+'?action=get_confirmed&callback='+cbName;
  document.body.appendChild(script);
}

function renderCalendar(){
  document.getElementById('month-label').textContent=calYear+'年'+(calMonth+1)+'月';
  var today=new Date();
  var todayStr=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  var heads=['日','月','火','水','木','金','土'];
  var html='';
  for(var h=0;h<7;h++){html+='<div class="cal-head'+(h===0?' sun':h===6?' sat':'')+'">'+heads[h]+'</div>';}
  var first=new Date(calYear,calMonth,1);
  var last=new Date(calYear,calMonth+1,0);
  var startDow=first.getDay();
  for(var i=0;i<startDow;i++){
    var pd=new Date(calYear,calMonth,1-startDow+i);
    html+='<div class="cal-cell other"><div class="day-num'+(pd.getDay()===0?' sun':pd.getDay()===6?' sat':'')+'">'+pd.getDate()+'</div></div>';
  }
  for(var day=1;day<=last.getDate();day++){
    var dateStr=calYear+'-'+pad(calMonth+1)+'-'+pad(day);
    var dow=(startDow+day-1)%7;
    var dayOrders=calOrders.filter(function(o){return o.date===dateStr;});
    var bulkQty=dayOrders.filter(function(o){return!o.isBag;}).reduce(function(s,o){return s+o.qty;},0);
    var hasOrder=dayOrders.length>0;
    var overLimit=bulkQty>MAX_TOTAL;
    var isToday=dateStr===todayStr;
    var isSel=dateStr===selDate;
    var cls='cal-cell'+(hasOrder?' has-order':'')+(overLimit?' over-limit':'')+(isSel?' selected':'');
    var numCls='day-num'+(dow===0?' sun':dow===6?' sat':'');
    var numHTML=isToday?'<span class="today-num">'+day+'</span>':''+day;
    var farmsSeen={};
    dayOrders.forEach(function(o){
      var fk=Object.keys(FARMS).find(function(k){return FARMS[k].label===o.farm;});
      if(fk)farmsSeen[fk]=true;
    });
    var dots=Object.keys(farmsSeen).map(function(fk){return'<div class="dot '+FARMS[fk].dot+'"></div>';}).join('');
    /* 積載量バー */
    var barPct=Math.min(bulkQty/MAX_TOTAL*100,100);
    var barColor=bulkQty>MAX_TOTAL?'#c0392b':bulkQty>WARN_THRESHOLD?'#E67E22':'#1D9E75';
    var barHTML=hasOrder?'<div class="qty-bar"><div class="qty-bar-inner" style="width:'+barPct+'%;background:'+barColor+';"></div></div>':'';
    var cntHTML=dayOrders.length>0?'<div class="cnt-lbl">'+dayOrders.filter(function(o){return!o.isBag;}).length+'件</div>':'';
    html+='<div class="'+cls+'" data-date="'+dateStr+'" onclick="selectDate(\''+dateStr+'\')">'+
      '<div class="'+numCls+'">'+numHTML+'</div>'+
      '<div class="dot-row">'+dots+'</div>'+cntHTML+barHTML+'</div>';
  }
  var used=(startDow+last.getDate())%7;
  var remain=used===0?0:7-used;
  for(var ri=0;ri<remain;ri++){
    var rdow=(startDow+last.getDate()+ri)%7;
   html+='<div class="cal-cell other"><div class="day-num'+(rdow===6?' sat':'')+'">'+(ri+1)+'</div></div>';
  }
  document.getElementById('cal-grid').innerHTML=html;
}

function selectDate(dateStr){
  selDate=dateStr;
  document.querySelectorAll('.cal-cell').forEach(function(c){
    if(c.dataset.date===dateStr)c.classList.add('selected');
    else c.classList.remove('selected');
  });
  showDetail(dateStr);
}

function showDetail(dateStr){
  currentDetailDate=dateStr;
  var card=document.getElementById('detail-card');
  var dayOrders=calOrders.filter(function(o){return o.date===dateStr;});
  if(!dayOrders.length){card.style.display='none';return;}
  card.style.display='';

  var bulkOrders=dayOrders.filter(function(o){return!o.isBag;});
  var bagOrders=dayOrders.filter(function(o){return o.isBag;});

  var pct48=Math.min(totalBulk/MAX_TOTAL*100,100);

  var bagOverLimit=MAX_BAG_PER_TRUCK?totalBag>MAX_BAG_PER_TRUCK:false;

    +'<div class="limit-bar-outer"><div class="limit-bar-inner" style="width:'+pct48+'%;background:'+bar48Color+';"></div></div>'
    +'<div style="font-size:10px;color:var(--muted);margin-top:3px;">上限20t（10t×2便）まで'+(MAX_TOTAL-totalBulk).toFixed(0)+'t空き</div>'
    +(bagOrders.length?'<div style="font-size:10px;margin-top:4px;color:var(--muted);">紙袋: '+totalBag+'袋</div>':'')
    +'</div>';
  /* タンク重複チェック */

  /* バラ飼料行 */
  var bulkRows=bulkOrders.map(function(o){

      :'<span style="background:#E67E22;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;margin-left:4px;">未確定</span>';
    var deleteBtn=!o.confirmed&&!VIEW_MODE
      ?'<button onclick="deleteOrder(\''+o.id+'\')" style="background:#c0392b;color:#fff;border:none;border-radius:4px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;">削除</button>'
      :'';
    return '<div class="det-row" style="border-left:3px solid '+(o.confirmed?'#1D9E75':'#E67E22')+';padding-left:8px;">'
      +'<span class="badge '+bc+'">'+o.farm+'</span>'
      +'<div class="det-info">'
        +'<div class="det-tank">タンク '+o.tank+(isDup?' <span style="color:#c00;font-size:10px;">重複</span>':'')+confirmedBadge+'</div>'
        +'<div class="det-brand">'+o.brand+'</div>'
      +'</div>'
      +'<div><div class="det-qty">'+o.qty+'t</div>'+(o.additive==='yes'?'<div class="det-add">添加剤有</div>':'')+(o.nextDay==='yes'?'<div class="det-add" style="background:#FCEEDA;color:#E67E22;">翌日配達可</div>':'')+'</div>'
      +deleteBtn
      +'</div>';
  }).join('');
  /* 紙袋行 */

      var fk=Object.keys(FARMS).find(function(k){return FARMS[k].label===o.farm;})||'mizobe';
      var bc=FARMS[fk].badge;
      var confirmedBadge=o.confirmed
        ?'<span style="background:#1D9E75;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;margin-left:4px;">確定</span>'
        :'<span style="background:#E67E22;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;margin-left:4px;">未確定</span>';

        +'<div class="det-info">'
          +'<div class="det-tank">'+o.brand+confirmedBadge+'</div>'
        +'</div>'
        +'<div><div class="det-qty">'+o.qty+'袋</div></div>'
        +(!o.confirmed&&!VIEW_MODE?'<button onclick="deleteOrder(\''+o.id+'\')" style="background:#c0392b;color:#fff;border:none;border-radius:4px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;">削除</button>':'')
        +'</div>';
    }).join('')+'</div>':'';
  /* メモ */
  var memo=calMemos[dateStr]||'';
  var memoHTML=memo?'<div class="memo-box"><div class="memo-label">📝 変更メモ</div><div class="memo-text">'+memo+'</div></div>':'';
  document.getElementById('detail-panel').innerHTML=
    '<div class="detail-date-lbl">'+(d.getMonth()+1)+'月'+d.getDate()+'日('+wd+')'
      +'<span class="detail-badge">バラ '+bulkOrders.length+'件 / '+totalBulk.toFixed(0)+'t'+(bagOrders.length?' / 紙袋'+bagOrders.length+'件':'')+'</span>'
    +'</div>'
    +limitHTML+warnHTML+bulkRows+bagRows+memoHTML;
}

function renderPrevNext(){
  var today=new Date();
  var todayStr=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  var dates={};
  calOrders.filter(function(o){return!o.isBag;}).forEach(function(o){dates[o.date]=true;});
  var sorted=Object.keys(dates).sort();
  var past=sorted.filter(function(d){return d<todayStr;});
  var future=sorted.filter(function(d){return d>=todayStr;});
  var prev=past.length?past[past.length-1]:null;
  var next=future.length?future[0]:null;
  function makeCard(label,arrow,dateStr){
    if(!dateStr)return'<div class="pn-card"><div class="pn-lbl">'+arrow+' '+label+'</div><div class="pn-date" style="color:var(--muted);">なし</div></div>';
    var dp=dateStr.split('-');
    var d=new Date(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2]));
    var wd=['日','月','火','水','木','金','土'][d.getDay()];
    var cnt=0,qty=0;
    calOrders.filter(function(o){return!o.isBag;}).forEach(function(o){if(o.date===dateStr){cnt++;qty+=o.qty;}});
    return'<div class="pn-card"><div class="pn-lbl">'+arrow+' '+label+'</div>'
      +'<div class="pn-date">'+(d.getMonth()+1)+'月'+d.getDate()+'日('+wd+')</div>'
      +'<div class="pn-cnt">'+cnt+'件 / '+qty.toFixed(0)+'t</div></div>';
  }
  document.getElementById('pn-grid').innerHTML=makeCard('前回','◀',prev)+makeCard('次回','▶',next);
}

function renderPredictions(){
  var el=document.getElementById('predict-list');
  if(!el)return;
  var byTank={};
  calOrders.filter(function(o){return!o.isBag;}).forEach(function(o){
    if(!byTank[o.tank])byTank[o.tank]=[];
    byTank[o.tank].push(o);
  });
  var today=new Date();
  var todayStr=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate());
  var results=[];
  Object.keys(byTank).forEach(function(tank){
    var list=byTank[tank].slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
    var uniqDates=[];
    list.forEach(function(o){if(uniqDates.indexOf(o.date)<0)uniqDates.push(o.date);});
    if(uniqDates.length<2)return; /* 予測には最低2回分の実績が必要 */
    var toDateObj=function(s){var p=s.split('-');return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));};
    var intervals=[];
    for(var i=1;i<uniqDates.length;i++){
      intervals.push(Math.round((toDateObj(uniqDates[i])-toDateObj(uniqDates[i-1]))/86400000));
    }
    var avgInterval=intervals.reduce(function(a,b){return a+b;},0)/intervals.length;
    var qtys=list.map(function(o){return o.qty;});
    var avgQty=qtys.reduce(function(a,b){return a+b;},0)/qtys.length;
    var lastDate=uniqDates[uniqDates.length-1];
    var brand=list[list.length-1].brand;
    var predictedDate=toDateObj(lastDate);
    predictedDate.setDate(predictedDate.getDate()+Math.round(avgInterval));
    var predStr=predictedDate.getFullYear()+'-'+pad(predictedDate.getMonth()+1)+'-'+pad(predictedDate.getDate());
    results.push({tank:tank,brand:brand,lastDate:lastDate,predStr:predStr,predictedDate:predictedDate,avgQty:avgQty});
  });
  if(!results.length){el.innerHTML='<div style="font-size:11px;color:var(--muted);padding:8px 0;">予測に十分な実績データがまだありません（同じタンクで2回以上の注文実績が必要です）。</div>';return;}
  results.sort(function(a,b){return a.predStr<b.predStr?-1:a.predStr>b.predStr?1:0;});
  el.innerHTML=results.map(function(r){
    var daysUntil=Math.round((r.predictedDate-new Date(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
    var soon=daysUntil<=2;
    var lp=r.lastDate.split('-'),ld=new Date(parseInt(lp[0]),parseInt(lp[1])-1,parseInt(lp[2]));
    var pp=r.predStr.split('-'),pd=new Date(parseInt(pp[0]),parseInt(pp[1])-1,parseInt(pp[2]));
    return'<div class="pred-row">'
      +'<div style="display:flex;align-items:center;gap:8px;min-width:0;">'
        +'<span class="pred-tank">'+r.tank+'</span>'
        +'<span class="pred-brand">'+r.brand+'</span>'
      +'</div>'
      +'<span class="pred-last">最終'+(ld.getMonth()+1)+'/'+ld.getDate()+'</span>'
      +'<span class="pred-next '+(soon?'soon':'normal')+'">'+(pd.getMonth()+1)+'/'+pd.getDate()+'頃</span>'
      +'<span class="pred-qty">約'+r.avgQty.toFixed(0)+'t</span>'
    +'</div>';
  }).join('');
}

function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove('show');},2400);
}
